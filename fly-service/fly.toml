app = "akashvani-session"
primary_region = "sin"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3002"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # This is a tiny JSON API; 25 was low enough that a handful of desktop clients
  # polling at once tripped the limit and the proxy started refusing connections.
  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
